<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>局域网测试</title>
<style>
body{font-family:sans-serif;padding:12px;background:#111;color:#eee}
button{margin:4px 4px 4px 0;padding:8px 12px}
input,textarea{width:100%;box-sizing:border-box;margin:4px 0;background:#222;color:#eee;border:1px solid #444;padding:6px}
#log{white-space:pre-wrap;font-size:12px;max-height:40vh;overflow:auto;background:#1a1a1a;padding:8px}
</style>
</head>
<body>
<h3>局域网传输测试 0.4-lan2</h3>
<div>
  <button onclick="doNet()">netInfo</button>
  <button onclick="doPick()">选文件</button>
  <button onclick="doServe()">serve</button>
  <button onclick="doStop()">stop</button>
</div>
<div>peerIp（可选）<input id="peer" placeholder="接收方 IP"/></div>
<div>serve 结果<textarea id="serveOut" rows="4"></textarea></div>
<div>粘贴后 fetch<textarea id="fetchIn" rows="3"></textarea>
<button onclick="doFetch()">fetch</button>
<button onclick="doCancel()">cancel</button>
<button onclick="doBadToken()">错 token</button>
<button onclick="doSaveProbe()">分块保存200MB探针</button>
<button onclick="doSaveAbort()">saveAbort</button>
<button onclick="doSaveSizeMismatch()">err:size</button>
<button onclick="doSaveBadOffset()">err:offset</button>
<button onclick="doSaveTooMany()">err:toomany</button>
</div>
<div id="log"></div>
<script>
function L(s){var e=document.getElementById('log');e.textContent+=s+"\n";e.scrollTop=e.scrollHeight}
function rid(){return 'r'+Math.random().toString(36).slice(2,10)}
var lastFiles=[], lastReq='', fetchReq='';
window.__nativeLan=function(o){
  try{
    var e=o&&o.e;
    var c=JSON.parse(JSON.stringify(o));
    if(c.token) delete c.token;
    L(JSON.stringify(c));
    if(e==='picked'){ lastFiles=o.files||[]; lastReq=o.req||''; }
  }catch(err){L(String(o))}
};
function api(){return window.NativeLan}
function doNet(){try{L(api().netInfo())}catch(e){L(String(e))}}
function doPick(){
  lastReq=rid();
  try{L('pickFiles -> '+api().pickFiles(lastReq))}catch(e){L(String(e))}
}
function doServe(){
  try{
    if(!lastFiles.length){L('先选文件');return}
    var ids=lastFiles.map(function(f){return f.id});
    var peer=document.getElementById('peer').value.trim();
    var opts=peer?JSON.stringify({peerIp:peer}):'{}';
    var r=api().serve(JSON.stringify(ids), opts);
    L('serve return (token only in box)');
    var o=JSON.parse(r);
    if(o.ok){
      document.getElementById('serveOut').value=JSON.stringify({
        base:o.base||('http://'+o.ip+':'+o.port),
        token:o.token,
        files:lastFiles
      });
    }else document.getElementById('serveOut').value=r;
  }catch(e){L(String(e))}
}
function doFetch(){
  try{
    var j=JSON.parse(document.getElementById('fetchIn').value.trim());
    fetchReq=rid();
    L('fetch -> '+api().fetch(fetchReq, j.base, j.token, JSON.stringify(j.files)));
  }catch(e){L(String(e))}
}
function doCancel(){try{L('cancel -> '+api().cancel(fetchReq))}catch(e){L(String(e))}}
function doStop(){try{L('stop -> '+api().stop())}catch(e){L(String(e))}}
function doBadToken(){
  try{
    var j=JSON.parse(document.getElementById('fetchIn').value.trim());
    fetchReq=rid();
    L('bad token -> '+api().fetch(fetchReq, j.base, 'deadbeef', JSON.stringify(j.files)));
  }catch(e){L(String(e))}
}
L('version='+(api()?api().version():'no'));
var saveH=null,saveOff=0;
function crc32(buf){var c=~0>>>0;for(var i=0;i<buf.length;i++){c^=buf[i];for(var k=0;k<8;k++)c=(c>>>1)^(0xedb88320&(-(c&1)));}return(~c)>>>0;}
function u8ToB64(a){var s='',i=0;while(i<a.length){var n=Math.min(8192,a.length-i);var sl=a.subarray(i,i+n);s+=String.fromCharCode.apply(null,sl);i+=n;}return btoa(s)}
function doSaveProbe(){
  try{
    var total=200*1024*1024, chunk=512*1024, seed=12345;
    function rnd(){seed=(seed*1103515245+12345)&0x7fffffff;return seed&255;}
    var r=api().saveOpen('lan-probe-200m.bin', total);
    L('saveOpen '+r);
    if(String(r).indexOf('ok:')!==0)return;
    saveH=String(r).slice(3);saveOff=0;var crc=~0>>>0,left=total;
    function step(){
      if(left<=0){
        var c=api().saveClose(saveH);
        L('saveClose '+c+' bytes='+saveOff+' crc32='+(crc>>>0));
        return;
      }
      var n=Math.min(chunk,left);var a=new Uint8Array(n);
      for(var i=0;i<n;i++){a[i]=rnd();crc^=a[i];for(var k=0;k<8;k++)crc=(crc>>>1)^(0xedb88320&(-(crc&1)));}
      crc=crc>>>0;
      var w=api().saveWrite(saveH,saveOff,u8ToB64(a));
      if(w!=='ok'){L('saveWrite '+w+' at '+saveOff);return;}
      saveOff+=n;left-=n;
      if(saveOff%(5*1024*1024)===0)L('written '+saveOff+' crc='+(crc>>>0));
      setTimeout(step,0);
    }
    step();
  }catch(e){L(String(e))}
}
function doSaveAbort(){try{L('abort '+api().saveAbort(saveH||''))}catch(e){L(String(e))}}
function doSaveSizeMismatch(){
  try{
    var r=api().saveOpen('size-mismatch.bin',100);
    L('open '+r);if(String(r).indexOf('ok:')!==0)return;
    var h=String(r).slice(3);
    var a=new Uint8Array(10);var w=api().saveWrite(h,0,u8ToB64(a));L('write '+w);
    L('close expect err:size -> '+api().saveClose(h));
  }catch(e){L(String(e))}
}
function doSaveBadOffset(){
  try{
    var r=api().saveOpen('bad-offset.bin',100);
    L('open '+r);if(String(r).indexOf('ok:')!==0)return;
    var h=String(r).slice(3);
    L('write offset1 expect err:offset -> '+api().saveWrite(h,1,u8ToB64(new Uint8Array(1))));
    api().saveAbort(h);
  }catch(e){L(String(e))}
}
function doSaveTooMany(){
  try{
    var a=api().saveOpen('t1.bin',10),b=api().saveOpen('t2.bin',10),c=api().saveOpen('t3.bin',10);
    L('h1='+a+' h2='+b+' h3 expect err:toomany -> '+c);
    try{api().saveAbort(String(a).slice(3))}catch(e){}
    try{api().saveAbort(String(b).slice(3))}catch(e){}
  }catch(e){L(String(e))}
}

</script>
</body>
</html>
